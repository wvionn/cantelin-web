<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />

  <title>Cantelin — Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/styles.css" />

<body data-page="catalogue">
  <!-- Decorative Floating Stars -->
  <div class="bg-decor" aria-hidden="true">
    <svg class="decor-star decor-star--tl" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="starGradCatA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffe047" />
          <stop offset="55%" stop-color="#ff64a8" />
          <stop offset="100%" stop-color="#a586ff" />
        </linearGradient>
      </defs>
      <path fill="url(#starGradCatA)" d="M50 6l12 26 28 4-20 19 5 28-25-13-25 13 5-28-20-19 28-4z" />
    </svg>
    <svg class="decor-star decor-star--tr" viewBox="0 0 100 100">
      <path fill="url(#starGradCatA)" d="M50 6l12 26 28 4-20 19 5 28-25-13-25 13 5-28-20-19 28-4z" />
    </svg>
    <svg class="decor-star decor-star--bl" viewBox="0 0 100 100">
      <path fill="url(#starGradCatA)" d="M50 6l12 26 28 4-20 19 5 28-25-13-25 13 5-28-20-19 28-4z" />
    </svg>
    <svg class="decor-star decor-star--br" viewBox="0 0 100 100">
      <path fill="url(#starGradCatA)" d="M50 6l12 26 28 4-20 19 5 28-25-13-25 13 5-28-20-19 28-4z" />
    </svg>
  </div>

  <div class="page-shell">
    <header class="site-header">
      <a href="index.html" class="brand-logo brand-logo--catalogue" aria-label="Cantelin Catalogue - Kembali ke Home">
        <svg class="brand-star" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="#f03d7e"
            d="M32 5l8.2 16.8L59 24.5 45.4 37.7l3.2 18.8L32 47.6l-16.6 8.9 3.2-18.8L5 24.5l18.8-2.7z" />
        </svg>
        <span class="brand-wordmark">Cantelin Catalogue</span>
      </a>

      <nav class="site-nav" aria-label="Navigasi Utama">
        <a href="index.html" class="nav-link">Home</a>
        <a href="catalogue.html" class="nav-link is-active" aria-current="page">Catalogue</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
    </header>

    <main class="catalogue-main">
      <h1 class="sr-only">Cantelin Catalogue</h1>

      <section class="catalogue-grid" id="catalogue-grid" aria-label="Daftar Produk Katalog Cantelin"></section>

      <div class="catalogue-footer-cta">
        <button type="button" class="cta-pill cta-pill--pink" onclick="openDmLink()">
          Order Now &#8599;
        </button>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
